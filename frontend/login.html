<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clear - Sign In</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Space+Grotesk:wght@600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#002116",
                    "surface-bright": "#38393d",
                    "on-error": "#690005",
                    "error-container": "#93000a",
                    "on-primary-fixed-variant": "#474747",
                    "outline-variant": "#4c4546",
                    "surface-container-low": "#1a1b1f",
                    "inverse-primary": "#5e5e5e",
                    "primary-container": "#000000",
                    "on-tertiary-container": "#008564",
                    "on-primary": "#303030",
                    "secondary": "#c8c6c5",
                    "tertiary-fixed-dim": "#00e1ab",
                    "tertiary": "#00e1ab",
                    "on-secondary": "#313030",
                    "surface": "#121317",
                    "surface-variant": "#343539",
                    "tertiary-container": "#000000",
                    "on-secondary-fixed-variant": "#474646",
                    "tertiary-fixed": "#36ffc4",
                    "on-error-container": "#ffdad6",
                    "primary-fixed-dim": "#c6c6c6",
                    "background": "#121317",
                    "secondary-fixed-dim": "#c8c6c5",
                    "secondary-fixed": "#e5e2e1",
                    "outline": "#988e90",
                    "on-surface": "#e3e2e7",
                    "on-background": "#e3e2e7",
                    "inverse-on-surface": "#2f3034",
                    "on-primary-fixed": "#1b1b1b",
                    "on-secondary-container": "#bab8b7",
                    "inverse-surface": "#e3e2e7",
                    "on-primary-container": "#757575",
                    "surface-container": "#1e1f23",
                    "on-secondary-fixed": "#1c1b1b",
                    "on-tertiary": "#003828",
                    "surface-tint": "#c6c6c6",
                    "error": "#ffb4ab",
                    "surface-container-lowest": "#0d0e12",
                    "surface-dim": "#121317",
                    "on-tertiary-fixed-variant": "#00513c",
                    "surface-container-highest": "#343539",
                    "secondary-container": "#4a4949",
                    "primary": "#c6c6c6",
                    "surface-container-high": "#292a2e",
                    "primary-fixed": "#e2e2e2",
                    "on-surface-variant": "#cfc4c5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1200px",
                    "unit": "8px",
                    "margin-edge": "64px",
                    "gutter": "32px",
                    "section-gap": "160px"
            },
            "fontFamily": {
                    "display-xl": ["Inter"],
                    "label-caps": ["Space Grotesk"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "display-xl": ["80px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600" }],
                    "headline-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                    "headline-md": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                    "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }]
            }
          }
        }
      }
    </script>
<style>
        /* Base styles to ensure inputs clear browser defaults cleanly */
        input:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex items-center justify-center relative overflow-x-hidden overflow-y-auto py-6 font-sans antialiased selection:bg-tertiary selection:text-black">
<!-- Ambient Light Effects -->
<div class="absolute top-[-10%] left-[-5%] w-[600px] h-[600px] bg-tertiary/10 rounded-full blur-[150px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[800px] h-[800px] bg-tertiary/10 rounded-full blur-[200px] pointer-events-none"></div>
<!-- Main Content Wrapper -->
<div class="z-10 w-full max-w-[440px] px-4 flex flex-col items-center gap-6">
<!-- Brand Logo -->
<div class="flex flex-col items-center gap-2 mb-4">
<img alt="Clear" class="h-[34px] w-auto object-contain" src="/cleanicon-logo.png"/>
</div>
<!-- Clean White Login Card -->
<div class="w-full bg-white border border-gray-200 rounded-xl p-6 sm:p-8 md:p-10 shadow-lg flex flex-col gap-8">
<form id="login-form" class="flex flex-col gap-6">
<!-- Input Group: Username/Email -->
<div class="flex flex-col gap-4">
<label class="font-label-caps text-label-caps text-gray-600 uppercase" for="identity">Email</label>
<div class="relative group">
<input autocomplete="username" class="w-full bg-transparent border-0 border-b-2 border-gray-300 font-body-md text-body-md text-gray-900 py-2 px-0 focus:ring-0 focus:border-tertiary transition-colors placeholder:text-gray-400 group-hover:border-gray-400" id="identity" name="identity" placeholder="admin@clear.siem" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps text-gray-600 uppercase" for="password">Password</label>
<a class="font-body-md text-body-md text-gray-600 hover:text-tertiary transition-colors text-[14px]" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input autocomplete="current-password" class="w-full bg-transparent border-0 border-b-2 border-gray-300 font-body-md text-body-md text-gray-900 py-2 px-0 focus:ring-0 focus:border-tertiary transition-colors placeholder:text-gray-400 group-hover:border-gray-400" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-4 bg-tertiary text-black font-label-caps text-label-caps uppercase tracking-widest py-4 rounded-DEFAULT transition-all duration-300 hover:bg-tertiary-fixed hover:shadow-[0_4px_20px_rgba(0,225,171,0.3)] active:scale-[0.98]" type="submit">
                    Sign In
                </button>
<p id="login-error" class="hidden text-sm text-red-600"></p>
</form>
</div>
<!-- Secondary Action Container -->
<div class="flex items-center gap-2 mt-4 opacity-80 hover:opacity-100 transition-opacity">
<span class="font-body-md text-body-md text-gray-600">New to Clear?</span>
<a class="font-body-md text-body-md text-tertiary hover:text-tertiary-fixed transition-colors font-semibold" href="/signup">Create an account</a>
</div>
</div>
<script>
  (function () {
    const formEl = document.getElementById('login-form');
    const identityEl = document.getElementById('identity');
    const passwordEl = document.getElementById('password');
    const errorEl = document.getElementById('login-error');
    const AUTH_TOKEN_STORAGE_KEY = 'wazuh_auth_token';

    async function hasValidSession(token) {
      try {
        const response = await fetch('/api/auth/session', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!response.ok) {
          return null;
        }
        return await response.json().catch(() => null);
      } catch (_error) {
        return null;
      }
    }

    function showError(message) {
      if (!errorEl) {
        return;
      }
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function clearError() {
      if (!errorEl) {
        return;
      }
      errorEl.textContent = '';
      errorEl.classList.add('hidden');
    }

    const existingToken = localStorage.getItem(AUTH_TOKEN_STORAGE_KEY);
    if (existingToken) {
      hasValidSession(existingToken).then((sessionPayload) => {
        if (sessionPayload && sessionPayload.authenticated) {
          const nextPath =
            (sessionPayload.onboarding && sessionPayload.onboarding.nextPath) || '/';
          window.location.replace(nextPath);
          return;
        }
        localStorage.removeItem(AUTH_TOKEN_STORAGE_KEY);
      });
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();
      const identity = String(identityEl.value || '').trim();
      const password = String(passwordEl.value || '');
      if (!identity || !password) {
        showError('Please enter email and password.');
        return;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity, password })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          showError(payload.error || 'Login failed.');
          return;
        }
        localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, String(payload.token || '').trim());
        const nextPath = (payload.onboarding && payload.onboarding.nextPath) || '/';
        window.location.replace(nextPath);
      } catch (_error) {
        showError('Login request failed.');
      }
    });
  })();
</script>
</body></html>
