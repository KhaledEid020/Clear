<script>
  (function () {
    const AUTH_TOKEN_STORAGE_KEY = 'wazuh_auth_token';
    const indexerUrlEl = document.getElementById('indexer_url');
    const indexerUserEl = document.getElementById('indexer_user');
    const indexerPassEl = document.getElementById('indexer_pass');
    const managerUrlEl = document.getElementById('manager_url');
    const sshUserEl = document.getElementById('ssh_user');
    const sshPortEl = document.getElementById('ssh_port');
    const sshAuthModeEl = document.getElementById('ssh_auth_mode');
    const sshPasswordWrapEl = document.getElementById('ssh_password_wrap');
    const sshKeyWrapEl = document.getElementById('ssh_key_wrap');
    const sshAuthEl = document.getElementById('ssh_auth');
    const sshKeyTextEl = document.getElementById('ssh_key_text');
    const sshKeyImportBtnEl = document.getElementById('ssh_key_import_btn');
    const sshKeyFileEl = document.getElementById('ssh_key_file');
    const sshAuthModeHintEl = document.getElementById('ssh_auth_mode_hint');
    const finishBtn = document.getElementById('finish-siem-config-btn');
    const cancelBtn = document.getElementById('cancel-siem-config-btn');
    const testIndexerBtnEl = document.getElementById('test-indexer-btn');
    const indexerTestStatusEl = document.getElementById('indexer-test-status');
    const testManagerBtnEl = document.getElementById('test-manager-btn');
    const managerTestStatusEl = document.getElementById('manager-test-status');
    let sshAuthMode = 'password';
    let indexerTestInProgress = false;
    let managerTestInProgress = false;

    function getToken() {
      return String(localStorage.getItem(AUTH_TOKEN_STORAGE_KEY) || '').trim();
    }
    function redirectToLogin() {
      window.location.replace('/login');
    }
    async function apiFetch(url, options = {}) {
      const token = getToken();
      if (!token) {
        redirectToLogin();
        throw new Error('Authentication required');
      }
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', 'Bearer ' + token);
      return fetch(url, { ...options, headers });
    }

    function normalizeSshAuthMode(value) {
      return String(value || '').trim().toLowerCase() === 'key_file' ? 'key_file' : 'password';
    }

    function normalizeSshPrivateKeyText(value) {
      let key = String(value || '');
      if (!key) {
        return '';
      }
      key = key.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
      if (!key.includes('\n') && key.includes('\\n')) {
        key = key.replace(/\\n/g, '\n');
      }
      if (!key.includes('\n')) {
        const inlineMatch = key.match(
          /^(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----)(.+)(-----END [A-Z0-9 ]*PRIVATE KEY-----)$/
        );
        if (inlineMatch) {
          const header = inlineMatch[1];
          const body = inlineMatch[2].replace(/\s+/g, '');
          const footer = inlineMatch[3];
          const wrappedBody = body.match(/.{1,70}/g)?.join('\n') || '';
          key = `${header}\n${wrappedBody}\n${footer}`;
        }
      }
      return key;
    }

    function readSshAuthValue(mode = sshAuthMode) {
      if (normalizeSshAuthMode(mode) === 'key_file') {
        return normalizeSshPrivateKeyText(sshKeyTextEl?.value || '');
      }
      return String(sshAuthEl?.value || '').trim();
    }

    function setSshAuthMode(mode) {
      sshAuthMode = normalizeSshAuthMode(mode);
      if (sshAuthModeEl) {
        sshAuthModeEl.value = sshAuthMode;
      }
      if (sshPasswordWrapEl) {
        sshPasswordWrapEl.classList.toggle('hidden', sshAuthMode === 'key_file');
      }
      if (sshKeyWrapEl) {
        sshKeyWrapEl.classList.toggle('hidden', sshAuthMode !== 'key_file');
      }
      if (sshAuthModeHintEl) {
        sshAuthModeHintEl.textContent = sshAuthMode === 'key_file' ? 'Auth mode: key file uploaded' : 'Auth mode: password';
      }
    }

    function readPayload() {
      const mode = normalizeSshAuthMode(sshAuthModeEl?.value || sshAuthMode);
      const authValue = readSshAuthValue(mode);
      const inferredMode = /BEGIN [A-Z ]*PRIVATE KEY/.test(authValue) ? 'key_file' : mode;
      return {
        indexerUrl: String(indexerUrlEl.value || '').trim(),
        indexerUser: String(indexerUserEl.value || '').trim(),
        indexerPass: String(indexerPassEl.value || '').trim(),
        managerUrl: String(managerUrlEl.value || '').trim(),
        sshUser: String(sshUserEl.value || '').trim(),
        sshPort: Number(sshPortEl.value || 22),
        sshAuth: authValue,
        sshAuthMode: normalizeSshAuthMode(inferredMode)
      };
    }

    function setInlineTestStatus(element, message, type = 'neutral') {
      if (!element) {
        return;
      }
      element.textContent = String(message || '').trim();
      element.classList.remove('text-on-surface-variant', 'text-red-400', 'text-[#00e6c7]');
      if (type === 'error') {
        element.classList.add('text-red-400');
        return;
      }
      if (type === 'success') {
        element.classList.add('text-[#00e6c7]');
        return;
      }
      element.classList.add('text-on-surface-variant');
    }

    async function testIndexerConnection() {
      if (indexerTestInProgress) {
        return;
      }
      const indexerUrl = String(indexerUrlEl?.value || '').trim();
      const indexerUser = String(indexerUserEl?.value || '').trim();
      const indexerPass = String(indexerPassEl?.value || '').trim();
      if (!indexerUrl || !indexerUser || !indexerPass) {
        setInlineTestStatus(indexerTestStatusEl, 'Need indexer URL, user, and password.', 'error');
        return;
      }

      indexerTestInProgress = true;
      if (testIndexerBtnEl) {
        testIndexerBtnEl.disabled = true;
        testIndexerBtnEl.innerHTML = '<span class="siem-test-spinner"></span>Testing';
      }
      setInlineTestStatus(indexerTestStatusEl, 'Testing indexer...', 'neutral');

      try {
        const response = await apiFetch('/api/settings/test-indexer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ indexerUrl, indexerUser, indexerPass })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Indexer connection failed.');
        }
        setInlineTestStatus(indexerTestStatusEl, payload.message || 'Indexer connection successful.', 'success');
      } catch (error) {
        setInlineTestStatus(indexerTestStatusEl, error.message || 'Indexer connection failed.', 'error');
      } finally {
        indexerTestInProgress = false;
        if (testIndexerBtnEl) {
          testIndexerBtnEl.disabled = false;
          testIndexerBtnEl.textContent = 'Test Indexer';
        }
      }
    }

    async function testManagerConnection() {
      if (managerTestInProgress) {
        return;
      }
      const managerUrl = String(managerUrlEl?.value || '').trim();
      const sshPort = Number(sshPortEl?.value || 22);
      const sshUser = String(sshUserEl?.value || '').trim();
      const testSshAuthMode = normalizeSshAuthMode(sshAuthModeEl?.value || sshAuthMode);
      const sshAuth = readSshAuthValue(testSshAuthMode);
      if (!managerUrl || !Number.isFinite(sshPort) || sshPort <= 0) {
        setInlineTestStatus(managerTestStatusEl, 'Need manager URL/IP and valid SSH port.', 'error');
        return;
      }
      if (!sshUser || !sshAuth) {
        setInlineTestStatus(managerTestStatusEl, 'Need SSH user and authentication value.', 'error');
        return;
      }

      managerTestInProgress = true;
      if (testManagerBtnEl) {
        testManagerBtnEl.disabled = true;
        testManagerBtnEl.innerHTML = '<span class="siem-test-spinner"></span>Testing';
      }
      setInlineTestStatus(managerTestStatusEl, 'Testing SSH login...', 'neutral');

      try {
        const response = await apiFetch('/api/settings/test-manager', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ managerUrl, sshPort, sshUser, sshAuth, sshAuthMode: testSshAuthMode })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Manager connection failed.');
        }
        setInlineTestStatus(managerTestStatusEl, payload.message || 'Manager SSH login successful.', 'success');
      } catch (error) {
        setInlineTestStatus(managerTestStatusEl, error.message || 'Manager connection failed.', 'error');
      } finally {
        managerTestInProgress = false;
        if (testManagerBtnEl) {
          testManagerBtnEl.disabled = false;
          testManagerBtnEl.textContent = 'Test Manager';
        }
      }
    }

    async function guardAndHydrate() {
      const response = await apiFetch('/api/onboarding/status');
      if (!response.ok) {
        redirectToLogin();
        return;
      }
      const payload = await response.json().catch(() => ({}));
      const cfg = (payload.setup && payload.setup.siemConfig) || {};
      if (cfg.indexerUrl) indexerUrlEl.value = cfg.indexerUrl;
      if (cfg.indexerUser) indexerUserEl.value = cfg.indexerUser;
      if (cfg.indexerPass) indexerPassEl.value = cfg.indexerPass;
      if (cfg.managerUrl) managerUrlEl.value = cfg.managerUrl;
      if (cfg.sshUser) sshUserEl.value = cfg.sshUser;
      if (cfg.sshPort) sshPortEl.value = cfg.sshPort;
      if (sshAuthEl) sshAuthEl.value = '';
      if (sshKeyTextEl) sshKeyTextEl.value = '';
      const savedAuthRaw = String(cfg.sshAuth || '');
      const savedMode = normalizeSshAuthMode(cfg.sshAuthMode || '');
      if (savedMode === 'key_file') {
        if (sshKeyTextEl) sshKeyTextEl.value = normalizeSshPrivateKeyText(savedAuthRaw);
      } else if (savedAuthRaw && sshAuthEl) {
        sshAuthEl.value = savedAuthRaw.trim();
      }
      if (cfg.sshAuthMode) {
        setSshAuthMode(cfg.sshAuthMode);
      } else if (savedAuthRaw && /BEGIN [A-Z ]*PRIVATE KEY/.test(savedAuthRaw)) {
        setSshAuthMode('key_file');
        if (sshKeyTextEl) sshKeyTextEl.value = normalizeSshPrivateKeyText(savedAuthRaw);
      } else {
        setSshAuthMode('password');
      }
    }

    if (sshKeyImportBtnEl && sshKeyFileEl) {
      sshKeyImportBtnEl.addEventListener('click', () => {
        sshKeyFileEl.click();
      });
      sshKeyFileEl.addEventListener('change', async () => {
        const file = sshKeyFileEl.files && sshKeyFileEl.files[0] ? sshKeyFileEl.files[0] : null;
        if (!file) {
          return;
        }
        const lower = String(file.name || '').toLowerCase();
        if (!lower.endsWith('.key') && !lower.endsWith('.pem')) {
          alert('Please upload a .key or .pem file.');
          sshKeyFileEl.value = '';
          return;
        }
        const text = normalizeSshPrivateKeyText(await file.text());
        if (!text) {
          alert('Uploaded key file is empty.');
          sshKeyFileEl.value = '';
          return;
        }
        if (sshKeyTextEl) {
          sshKeyTextEl.value = text;
        }
        setSshAuthMode('key_file');
        sshKeyFileEl.value = '';
      });
    }

    if (sshAuthModeEl) {
      sshAuthModeEl.addEventListener('change', () => {
        setSshAuthMode(sshAuthModeEl.value);
      });
    }

    if (sshAuthEl) {
      sshAuthEl.addEventListener('input', () => {
        if (sshAuthMode !== 'key_file') {
          setSshAuthMode('password');
        }
      });
    }

    if (sshKeyTextEl) {
      sshKeyTextEl.addEventListener('input', () => {
        setSshAuthMode('key_file');
      });
    }

    if (testIndexerBtnEl) {
      testIndexerBtnEl.addEventListener('click', () => {
        testIndexerConnection().catch(() => {});
      });
    }

    if (testManagerBtnEl) {
      testManagerBtnEl.addEventListener('click', () => {
        testManagerConnection().catch(() => {});
      });
    }

    finishBtn.addEventListener('click', async () => {
      const body = readPayload();
      if (!body.indexerUrl || !body.indexerUser || !body.indexerPass || !body.managerUrl || !body.sshUser || !body.sshAuth) {
        alert('Please fill all required SIEM configuration fields.');
        return;
      }
      const response = await apiFetch('/api/onboarding/siem-config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        alert(payload.error || 'Failed to save SIEM configuration.');
        return;
      }
      window.location.assign(payload.nextPath || '/');
    });

    cancelBtn.addEventListener('click', () => {
      window.location.assign('/siemprovider');
    });

    setSshAuthMode('password');
    guardAndHydrate().catch(() => redirectToLogin());
  })();
</script>



</body></html>
