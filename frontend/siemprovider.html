<script>
  (function () {
    const AUTH_TOKEN_STORAGE_KEY = 'wazuh_auth_token';
    const continueBtn = document.getElementById('continue-siem-provider-btn');
    const fixedProvider = 'wazuh';

    function getToken() {
      return String(localStorage.getItem(AUTH_TOKEN_STORAGE_KEY) || '').trim();
    }
    function redirectToLogin() {
      window.location.replace('/login');
    }
    async function apiFetch(url, options = {}) {
      const token = getToken();
      if (!token) {
        redirectToLogin();
        throw new Error('Authentication required');
      }
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', 'Bearer ' + token);
      return fetch(url, { ...options, headers });
    }

    async function guard() {
      const response = await apiFetch('/api/onboarding/status');
      if (!response.ok) {
        redirectToLogin();
        return;
      }
    }

    continueBtn.addEventListener('click', async () => {
      const response = await apiFetch('/api/onboarding/siem-provider', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ siemProvider: fixedProvider })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        alert(payload.error || 'Failed to save SIEM provider.');
        return;
      }
      window.location.assign(payload.nextPath || '/siemconfig');
    });

    guard().catch(() => redirectToLogin());
  })();
</script>
