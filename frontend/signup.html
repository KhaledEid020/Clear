<style>

<body class="bg-gray-50 text-gray-900 font-body-md text-body-md min-h-screen flex items-center justify-center relative overflow-x-hidden overflow-y-auto py-6 selection:bg-tertiary/30 selection:text-tertiary">
<!-- Ambient Background Glow (Ethereal Digital Interface Aesthetic) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[800px] max-h-[800px] bg-tertiary/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Content Canvas (Navigation Shell Suppressed for Transactional Flow) -->
<div class="w-full max-w-md relative z-10 px-4">
<!-- White Card Container -->
<div class="bg-white border border-gray-200 rounded-xl p-6 sm:p-8 md:p-10 shadow-lg flex flex-col items-center">
<!-- Minimalist Brand Logo & Header -->
<div class="flex flex-col items-center mb-6 w-full">
<img alt="Clear Logo" class="h-[34px] w-auto mb-3 object-contain" src="/cleanicon-logo.png"/>
<p class="font-label-caps text-label-caps text-gray-500 mt-3 uppercase tracking-widest opacity-90">Admin Initialization</p>
</div>
<!-- Form -->
<form id="signup-form" action="#" class="w-full flex flex-col gap-4">
<!-- Full Name Field -->
<div class="relative group">
<input class="w-full bg-white border border-gray-300 text-gray-900 font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all duration-300 placeholder:text-gray-400 rounded-md block" id="fullName" placeholder="Full Name" required="" type="text"/>
</div>
<!-- Work Email Field -->
<div class="relative group">
<input class="w-full bg-white border border-gray-300 text-gray-900 font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all duration-300 placeholder:text-gray-400 rounded-md block" id="workEmail" placeholder="Work Email" required="" type="email"/>
</div>
<!-- Job Title Field -->
<div class="relative group">
<input class="w-full bg-white border border-gray-300 text-gray-900 font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all duration-300 placeholder:text-gray-400 rounded-md block" id="jobTitle" placeholder="Job Title (optional)" type="text"/>
</div>
<!-- Password Field -->
<div class="relative group">
<input class="w-full bg-white border border-gray-300 text-gray-900 font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all duration-300 placeholder:text-gray-400 rounded-md block" id="password" placeholder="Password" required="" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="relative group">
<input class="w-full bg-white border border-gray-300 text-gray-900 font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all duration-300 placeholder:text-gray-400 rounded-md block" id="confirmPassword" placeholder="Confirm Password" required="" type="password"/>
</div>
<!-- Primary Action Button -->
<button class="mt-2 w-full bg-tertiary text-on-tertiary-fixed font-label-caps text-label-caps py-3.5 rounded-DEFAULT flex items-center justify-center gap-3 hover:bg-tertiary-fixed hover:shadow-[0_0_25px_-5px_rgba(0,225,171,0.5)] transition-all duration-300 relative overflow-hidden group" type="submit">
<span class="relative z-10">Create Admin Account</span>
<span class="material-symbols-outlined relative z-10 transition-transform group-hover:translate-x-1" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<p id="signup-error" class="hidden text-sm text-red-600"></p>
<p id="signup-success" class="hidden text-sm text-green-600"></p>
</form>
<!-- Secondary Action -->
<div class="mt-5 text-center w-full">
<a class="font-body-md text-body-md text-gray-600 hover:text-tertiary transition-colors duration-300 inline-flex items-center gap-2" href="/login">
                    Sign in instead
                </a>
</div>
<!-- Subtle Infrastructure Note -->
<div class="mt-6 pt-5 w-full border-t border-gray-200">
<p class="font-label-caps text-[10px] leading-[1.6] uppercase tracking-widest text-gray-500 text-center flex flex-col items-center gap-3 max-w-[260px] mx-auto">
<span class="material-symbols-outlined text-[16px] opacity-60" style="font-variation-settings: 'FILL' 0;">dns</span>
                    This is a self-hosted instance. All data remains on your infrastructure.
                </p>
</div>
</div>
</div>
<script>
  (function () {
    const AUTH_TOKEN_STORAGE_KEY = 'wazuh_auth_token';
    const formEl = document.getElementById('signup-form');
    const fullNameEl = document.getElementById('fullName');
    const workEmailEl = document.getElementById('workEmail');
    const jobTitleEl = document.getElementById('jobTitle');
    const passwordEl = document.getElementById('password');
    const confirmPasswordEl = document.getElementById('confirmPassword');
    const errorEl = document.getElementById('signup-error');
    const successEl = document.getElementById('signup-success');

    function showError(message) {
      successEl.classList.add('hidden');
      successEl.textContent = '';
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function showSuccess(message) {
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
      successEl.textContent = message;
      successEl.classList.remove('hidden');
    }

    function clearMessages() {
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');
      errorEl.textContent = '';
      successEl.textContent = '';
    }

    const token = localStorage.getItem(AUTH_TOKEN_STORAGE_KEY);
    if (token) {
      fetch('/api/auth/session', {
        headers: { Authorization: 'Bearer ' + token }
      }).then(async (response) => {
        if (response.ok) {
          const payload = await response.json().catch(() => ({}));
          const nextPath = (payload.onboarding && payload.onboarding.nextPath) || '/';
          window.location.replace(nextPath);
        }
      }).catch(() => {});
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessages();

      const fullName = String(fullNameEl.value || '').trim();
      const email = String(workEmailEl.value || '').trim();
      const jobTitle = String(jobTitleEl.value || '').trim();
      const password = String(passwordEl.value || '');
      const confirmPassword = String(confirmPasswordEl.value || '');

      if (!fullName || !email || !password || !confirmPassword) {
        showError('Please fill all fields.');
        return;
      }
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName,
            email,
            jobTitle,
            password,
            confirmPassword
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          showError(payload.error || 'Signup failed.');
          return;
        }
        const token = String(payload.token || '').trim();
        if (token) {
          localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, token);
        }
        showSuccess('Account created. Continuing setup...');
        const nextPath = (payload.onboarding && payload.onboarding.nextPath) || '/aiprovider';
        setTimeout(() => {
          window.location.replace(nextPath);
        }, 900);
      } catch (_error) {
        showError('Signup request failed.');
      }
    });
  })();
</script>
</body></html>
