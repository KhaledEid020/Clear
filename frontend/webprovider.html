<script>
  (function () {
    const AUTH_TOKEN_STORAGE_KEY = 'wazuh_auth_token';
    const connectBtn = document.getElementById('connect-web-provider-btn');
    const apiKeyEl = document.getElementById('api_key');
    const radios = Array.from(document.querySelectorAll('input[name="search_provider"]'));

    function getToken() {
      return String(localStorage.getItem(AUTH_TOKEN_STORAGE_KEY) || '').trim();
    }
    function redirectToLogin() {
      window.location.replace('/login');
    }
    async function apiFetch(url, options = {}) {
      const token = getToken();
      if (!token) {
        redirectToLogin();
        throw new Error('Authentication required');
      }
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', 'Bearer ' + token);
      return fetch(url, { ...options, headers });
    }
    function selectedProvider() {
      const checked = radios.find((r) => r.checked);
      return checked ? String(checked.value || '').trim() : '';
    }

    async function guardAndHydrate() {
      const response = await apiFetch('/api/onboarding/status');
      if (!response.ok) {
        redirectToLogin();
        return;
      }
      const payload = await response.json().catch(() => ({}));
      const setup = payload.setup || {};
      if (setup.webProvider) {
        radios.forEach((radio) => { radio.checked = radio.value === setup.webProvider; });
      }
      if (setup.webApiKey && apiKeyEl) {
        apiKeyEl.value = setup.webApiKey;
      }
    }

    connectBtn.addEventListener('click', async () => {
      const webProvider = selectedProvider();
      const webApiKey = String(apiKeyEl.value || '').trim();
      if (!webProvider || !webApiKey) {
        alert('Please choose provider and API key.');
        return;
      }
      const response = await apiFetch('/api/onboarding/web-provider', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ webProvider, webApiKey })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        alert(payload.error || 'Failed to save web provider.');
        return;
      }
      window.location.assign(payload.nextPath || '/siemprovider');
    });

    guardAndHydrate().catch(() => redirectToLogin());
  })();
</script>
